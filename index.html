<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你的牌灵 · Which Tarot Card Are You</title>
<meta name="description" content="27 道情境题，测出属于你的那张大阿尔卡纳。支持简体中文、English、粵語。">
<meta property="og:title" content="测测你的牌灵">
<meta property="og:description" content="27 道情境题，测出属于你的那张大阿尔卡纳。">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<!-- 背景装饰纹样的图形定义 -->
<svg class="deco-defs" width="0" height="0" aria-hidden="true" focusable="false">
<defs>
  <g id="m-moon"><path d="M0,-24 A24,24 0 1,0 0,24 A30,30 0 0,0 0,-24 Z" vector-effect="non-scaling-stroke"/></g>
  <g id="m-lotus">
    <path d="M0,12 C-7,2 -5,-10 0,-16 C5,-10 7,2 0,12 Z" vector-effect="non-scaling-stroke"/>
    <path d="M0,12 C-12,6 -15,-4 -11,-11 C-5,-6 -2,4 0,12 Z" vector-effect="non-scaling-stroke"/>
    <path d="M0,12 C12,6 15,-4 11,-11 C5,-6 2,4 0,12 Z" vector-effect="non-scaling-stroke"/>
    <path d="M0,12 C-16,11 -22,3 -21,-5 C-13,-1 -6,6 0,12 Z" vector-effect="non-scaling-stroke"/>
    <path d="M0,12 C16,11 22,3 21,-5 C13,-1 6,6 0,12 Z" vector-effect="non-scaling-stroke"/>
    <path d="M-16,13 Q0,19 16,13" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="m-spark"><path d="M0,-13 C1.6,-4.5 4.5,-1.6 13,0 C4.5,1.6 1.6,4.5 0,13 C-1.6,4.5 -4.5,1.6 -13,0 C-4.5,-1.6 -1.6,-4.5 0,-13 Z" vector-effect="non-scaling-stroke"/></g>
  <g id="m-geo">
    <circle cx="0" cy="0" r="19" vector-effect="non-scaling-stroke"/>
    <path d="M0,-16 L14,8 L-14,8 Z" vector-effect="non-scaling-stroke"/>
    <path d="M0,16 L14,-8 L-14,-8 Z" vector-effect="non-scaling-stroke"/>
  </g>
  <g id="m-tri">
    <path d="M0,-12 L10.5,6.5 L-10.5,6.5 Z" vector-effect="non-scaling-stroke"/>
    <path d="M0,12 L-10.5,-6.5 L10.5,-6.5 Z" vector-effect="non-scaling-stroke"/>
  </g>
</defs>
</svg>

<div class="deco" aria-hidden="true">
  <svg class="motif" viewBox="-30 -30 60 60" style="left:7%;top:5%;width:54px;height:54px;transform:rotate(-16deg)"><use href="#m-moon"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:83%;top:6%;width:48px;height:48px"><use href="#m-lotus"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:29%;top:1%;width:20px;height:20px"><use href="#m-spark"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:64%;top:12%;width:15px;height:15px"><use href="#m-spark"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:84%;top:20%;width:46px;height:46px;transform:rotate(10deg)"><use href="#m-geo"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:13%;top:19%;width:17px;height:17px"><use href="#m-spark"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:4%;top:35%;width:44px;height:44px"><use href="#m-lotus"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:87%;top:34%;width:15px;height:15px"><use href="#m-spark"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:87%;top:45%;width:40px;height:40px;transform:rotate(158deg)"><use href="#m-moon"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:10%;top:58%;width:28px;height:28px;transform:rotate(12deg)"><use href="#m-tri"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:76%;top:61%;width:18px;height:18px"><use href="#m-spark"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:86%;top:76%;width:44px;height:44px"><use href="#m-lotus"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:7%;top:79%;width:38px;height:38px;transform:rotate(200deg)"><use href="#m-moon"/></svg>
  <svg class="motif" viewBox="-30 -30 60 60" style="left:47%;top:70%;width:15px;height:15px"><use href="#m-spark"/></svg>
</div>

<header class="topbar">
  <div class="brand" id="brand">测测你的牌灵</div>
  <nav class="langs" id="langs" aria-label="language"></nav>
</header>

<main class="wrap">

  <!-- 首页 -->
  <section id="screen-intro" class="screen">
    <div class="hero-card">
      <h1 id="ui-title">测测你的牌灵</h1>
      <div class="rule" aria-hidden="true"></div>
      <button id="btn-start" class="card-btn" type="button" aria-label="开始测试">
        <span class="card-halo" aria-hidden="true"></span>
        <img class="hero-img" src="assets/hero-card.png" alt="">
      </button>
      <p id="ui-start" class="hero-hint"></p>
      <p id="ui-disclaimer" class="fine hero-fine"></p>
    </div>
  </section>

  <!-- 答题 -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="progress-head">
      <span id="ui-progress" class="progress-text"></span>
      <span id="ui-chip" class="chip"></span>
    </div>
    <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    <div class="qcard">
      <h2 id="q-text" class="q-text"></h2>
      <div id="q-options" class="options"></div>
    </div>
    <div class="qfoot">
      <button id="btn-back" class="btn btn-ghost"></button>
    </div>
  </section>

  <!-- 结果 -->
  <section id="screen-result" class="screen" hidden>
    <div id="result-box"></div>
    <div class="actions">
      <button id="btn-share" class="btn btn-primary"></button>
      <button id="btn-copy" class="btn btn-ghost"></button>
    </div>
    <p id="ui-result-note" class="fine note"></p>
    <div class="actions">
      <button id="btn-retest" class="btn btn-ghost"></button>
      <button id="btn-all" class="btn btn-ghost"></button>
    </div>
    <div id="all-cards" class="all-grid" hidden></div>
  </section>

</main>

<script src="data/questions.js"></script>
<script src="data/cards.js"></script>
<script src="i18n/zh-CN.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/yue.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
</body>
</html>
